[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiosk-fleet-web"
version = "2.0.0"
description = "Kiosk Fleet Web: watch and manage every kiosk screen from a browser. Runs on Linux, in Docker."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "smbprotocol>=1.13",
    "impacket>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
kfw = "kfw.cli:main"

[tool.setuptools.packages.find]
include = ["kfw*"]

[tool.setuptools.package-data]
kfw = ["web/*", "templates/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
