name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kiosk-fleet-web:ci .
      - name: The image starts and answers
        run: |
          docker run -d --name kfw -p 8080:8080 -e KFW_DEMO=1 kiosk-fleet-web:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/healthz | grep '"fleet":true'
          docker logs kfw | grep 'setup?token='
          docker rm -f kfw
